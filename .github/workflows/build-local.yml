name: Build VoiceInk

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Build for local use
        run: make local

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: VoiceInk-app
          path: .local-build/Build/Products/Debug/VoiceInk.app
          retention-days: 7
